name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/project-chip/chip-build:217

    strategy:
      fail-fast: false
      matrix:
        include:
          # gcc
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
            is_clang: false

          # clang
          # temp fix: v21.0.0 bugged with gtest parametrized tests
          - os: ubuntu-latest
            cc: /usr/bin/clang
            cxx: /usr/bin/clang++
            is_clang: true

    steps:
      - uses: actions/checkout@v7

      - name: Mark workspace as safe for git
        run: git config --system --add safe.directory '*'

      - name: Setup project dependencies
        run: git submodule update --init

      - name: Setup CHIP dependencies
        working-directory: third_party/connectedhomeip
        run: scripts/checkout_submodules.py --shallow --platform linux

      - name: Cache protoc
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-build-protoc
          path: third_party/protobuf/bin/protoc

      - name: Cache CHIP pigweed
        id: pigweed-cache
        uses: actions/cache@v6
        with:
          key: ${{ runner.os }}-build-pigweed-${{ hashFiles('third_party/connectedhomeip/scripts/setup/requirements*.txt', 'third_party/connectedhomeip/third_party/pigweed/repo/package-lock.json') }}
          path: third_party/connectedhomeip/.environment

      - name: Bootstrap CHIP
        working-directory: third_party/connectedhomeip
        env:
          PW_NO_CIPD_CACHE_DIR: 1
        shell: bash
        run: source scripts/bootstrap.sh -p all,linux

      - name: Configure GN
        env:
          GN_ARGS: >-
            is_debug=false
            custom_toolchain="custom"
            is_clang=${{ matrix.is_clang }}
            target_cc="${{ matrix.cc }}"
            target_cxx="${{ matrix.cxx }}"
            target_ar="ar"
        run: third_party/connectedhomeip/scripts/run_in_build_env.sh 'gn gen out/build --args="$GN_ARGS"'

      - name: Compiler version
        run: ${{ matrix.cxx }} --version

      - name: Build mobmatter
        run: third_party/connectedhomeip/scripts/run_in_build_env.sh "ninja -C out/build"

      - name: Build tests
        run: third_party/connectedhomeip/scripts/run_in_build_env.sh "ninja -C out/build tests"

      - name: Run tests
        run: out/build/tests
